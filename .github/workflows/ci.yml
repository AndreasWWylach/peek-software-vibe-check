name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # semgrep runs the custom teardown rules + the golden tests.
      - name: Install semgrep
        run: pipx install semgrep

      # osv-scanner v2 runs the dependency CVE provider + its parser tests.
      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # madge runs the architecture-graph provider (circular dependencies).
      - name: Install madge
        run: npm install -g madge

      # scc runs the file-size provider (monolithic files → TD-019).
      - name: Install scc
        run: |
          curl -sSL -o /tmp/scc.tar.gz \
            https://github.com/boyter/scc/releases/download/v3.5.0/scc_Linux_x86_64.tar.gz
          tar -xzf /tmp/scc.tar.gz -C /tmp
          install -m 0755 /tmp/scc "$HOME/.local/bin/scc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gitleaks runs the secrets provider (hardcoded secrets → TD-016).
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # eslint runs the language-linter provider (QA hygiene findings).
      - name: Install eslint
        run: npm install -g eslint@9

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
