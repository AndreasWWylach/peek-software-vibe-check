name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # semgrep runs the custom teardown rules + the golden tests.
      - name: Install semgrep
        run: pipx install semgrep

      # osv-scanner v2 runs the dependency CVE provider + its parser tests.
      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
