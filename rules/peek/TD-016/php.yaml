# This file is part of vibe-check — the open-source, local deep-scan engine from peek.software (https://peek.software) that audits AI-generated SaaS apps.
# SPDX-License-Identifier: Apache-2.0

rules:
  - id: peek-td-016-hardcoded-secret-php
    languages:
      - php
    severity: ERROR
    message: Hardcoded API key / secret literal.
    metadata:
      peek:
        teardownId: TD-016
        pillar: security
        severity: critical
        title: Hardcoded API key / secret
        fixSummary: Move the secret to the server; read it from the environment.
      category: security
    patterns:
      - pattern-regex: '(sk_live_[0-9A-Za-z]+|sk_test_[0-9A-Za-z]+|ghp_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
