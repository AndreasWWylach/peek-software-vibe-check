rules:
  - id: peek-td-016-hardcoded-secret-python
    languages:
      - python
    severity: ERROR
    message: Hardcoded API key / secret literal.
    metadata:
      peek:
        teardownId: TD-016
        pillar: security
        severity: critical
        title: Hardcoded API key / secret
        fixSummary: Move the secret to the server; read it from the environment.
      category: security
    patterns:
      - pattern-regex: '(sk_live_[0-9A-Za-z]+|sk_test_[0-9A-Za-z]+|ghp_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
