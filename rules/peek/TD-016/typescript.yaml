# This file is part of vibe-check — the open-source, local deep-scan engine from peek.software (https://peek.software) that audits AI-generated SaaS apps.
# SPDX-License-Identifier: Apache-2.0

rules:
  - id: peek-td-016-hardcoded-secret-typescript
    languages:
      - typescript
      - javascript
    severity: ERROR
    message: Hardcoded API key / secret literal — ship it to the browser and anyone can read it.
    metadata:
      peek:
        teardownId: TD-016
        pillar: security
        severity: critical
        title: Hardcoded API key / secret
        fixSummary: Move the secret to the server; never ship the key to the browser.
      category: security
    patterns:
      - pattern-regex: '(sk_live_[0-9A-Za-z]+|sk_test_[0-9A-Za-z]+|ghp_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
  - id: peek-td-016-hardcoded-fallback-secret-typescript
    languages:
      - typescript
      - javascript
    severity: ERROR
    message: Sensitive env var with a hardcoded fallback — the fallback ships a dev secret into production.
    metadata:
      peek:
        teardownId: TD-016
        pillar: security
        severity: critical
        title: Hardcoded fallback secret
        fixSummary: Fail fast at startup when a required secret is missing; never fall back to a literal.
      category: security
    patterns:
      - pattern-either:
          - pattern: 'process.env.$VAR || "$FALLBACK"'
          - pattern: "process.env.$VAR || '$FALLBACK'"
      - metavariable-regex:
          metavariable: $VAR
          regex: '.*(SECRET|KEY|TOKEN|PASSWORD|AUTH|STRIPE|WEBHOOK).*'
