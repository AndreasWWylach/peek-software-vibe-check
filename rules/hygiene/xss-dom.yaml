# This file is part of vibe-check — the open-source, local deep-scan engine from peek.software (https://peek.software) that audits AI-generated SaaS apps.
# SPDX-License-Identifier: Apache-2.0
#
# Always-on hygiene rules (LastMile "Hardener" framework). These are pattern-mode
# signals — they flag the unconditionally-dangerous sinks, not tainted dataflow.
# `metadata.peek.hygiene = true` maps results to `kind: 'hygiene'` findings.
#
# `innerHTML = <variable>` is deliberately NOT flagged: assigning a non-literal
# to innerHTML/outerHTML is idiomatic DOM code, and only a taint engine can tell
# whether the value is attacker-controlled. A pattern-mode rule fired ~67 times
# on one real Pimcore app (precision-over-volume violation) — deferred to taint
# mode (docs §7.4, same reasoning as TD-044).
rules:
  # React's explicitly-dangerous escape hatch. Using it at all is a conscious
  # opt-out of escaping, so it is always worth flagging (near-zero false positives).
  - id: peek-hygiene-xss-dangerously-set-html
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: dangerouslySetInnerHTML renders raw HTML without escaping — sanitize untrusted HTML before use.
    metadata:
      peek:
        hygiene: true
        ruleId: xss-dangerously-set-html
        pillar: security
        severity: high
        title: XSS — dangerouslySetInnerHTML renders unsanitized HTML
        fixSummary: Sanitize the HTML (e.g. DOMPurify) or render via React children instead of dangerouslySetInnerHTML.
      category: security
    patterns:
      - pattern-either:
          - pattern: '<$TAG dangerouslySetInnerHTML={{__html: $X}} />'
          - pattern: '<$TAG dangerouslySetInnerHTML={{__html: $X}}></$TAG>'

  # Obsolete / unsafe DOM-write APIs. Flagged whenever used (advisory: whether
  # the data is attacker-controlled needs taint — report, don't score).
  - id: peek-hygiene-xss-dom-write
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: document.write / insertAdjacentHTML inject raw HTML — avoid with untrusted data.
    metadata:
      peek:
        hygiene: true
        ruleId: xss-dom-write
        pillar: security
        severity: medium
        advisory: true
        title: XSS — raw HTML injected into the DOM
        fixSummary: Avoid document.write() and insertAdjacentHTML(); build the DOM with textContent or a sanitizing renderer.
      category: security
    patterns:
      - pattern-either:
          - pattern: 'document.write($X)'
          - pattern: '$ELEM.insertAdjacentHTML($POS, $X)'
